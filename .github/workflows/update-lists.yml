name: Update Lists

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Rebuild lists from upstream sources
        run: npm run build:lists

      - name: Check for data changes
        id: changes
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes — nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changed — will release a patch version."
          fi

      - name: Run tests against new data
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Bump patch version and commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # npm version includes staged files in the release commit and creates tag v<new>.
          npm version patch -m "chore(release): v%s — refresh disposable domain lists"

      - name: Publish to npm via OIDC
        if: steps.changes.outputs.changed == 'true'
        # prepublishOnly runs `npm run build` automatically.
        run: npm publish --access public --provenance

      - name: Push commit and tag
        if: steps.changes.outputs.changed == 'true'
        run: git push --follow-tags
