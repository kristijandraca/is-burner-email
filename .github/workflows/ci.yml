name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  test-js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - name: Install dependencies
        working-directory: packages/js
        run: npm ci
      - name: Typecheck
        working-directory: packages/js
        run: npm run typecheck
      - name: Test
        working-directory: packages/js
        run: npm test
      - name: Build
        working-directory: packages/js
        run: npm run build

  test-py:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test deps
        working-directory: packages/py
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run pytest
        working-directory: packages/py
        run: python -m pytest

  test-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        working-directory: packages/go
        run: go test -v ./...
      - name: go build CLI
        working-directory: packages/go
        run: go build ./cmd/burner

  test-php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        # composer.json lives at the repo root so Packagist can scan it.
        run: composer install --prefer-dist --no-interaction
      - name: Run phpunit
        run: composer test

  test-csharp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: ['8.0.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Restore
        working-directory: packages/csharp
        run: dotnet restore
      - name: Test
        working-directory: packages/csharp
        run: dotnet test --no-restore --verbosity minimal
      - name: Build CLI
        working-directory: packages/csharp
        run: dotnet build cli/Burner.Cli/Burner.Cli.csproj --no-restore --configuration Release
