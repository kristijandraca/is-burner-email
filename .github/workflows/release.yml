name: Release

# Coordinated release across all four language packages. One shared version
# lives in /VERSION and is mirrored into each package file. Tags are pushed
# per-language so every registry picks up its own trigger.
#
# Publishes JS to npm and Python to PyPI, both via Trusted Publishing (OIDC).
# Go is tag-driven — pushing packages/go/vX.Y.Z below is the release.
# PHP: see the Packagist TODO below — needs a one-time webhook registration.
#
# Behavior:
#   - schedule: rebuild lists, release a patch across all languages if data changed
#   - workflow_dispatch: always release with the chosen bump

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root tooling
        run: npm ci

      - name: Install JS package deps
        working-directory: packages/js
        run: npm ci

      - name: Rebuild lists from upstream sources
        run: npm run build:lists

      - name: Detect data changes
        id: data
        run: |
          if git diff --quiet data/ packages/go/data/ packages/php/data/ packages/py/src/is_burner_email/data/ packages/csharp/src/IsBurnerEmail/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Data changes detected."
          fi

      - name: Decide release parameters
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — will release with ${{ inputs.bump }} bump."
          elif [ "${{ steps.data.outputs.changed }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "suffix= — refresh disposable domain lists" >> "$GITHUB_OUTPUT"
            echo "Cron with data changes — will release patch."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Cron with no data changes — nothing to release."
          fi

      - name: Bump shared version and sync into packages
        if: steps.decide.outputs.release == 'true'
        id: bumped
        run: |
          new_version=$(npx tsx scripts/bump-version.ts ${{ steps.decide.outputs.bump }})
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "New version: $new_version"

      - name: Typecheck, test, build (JS)
        if: steps.decide.outputs.release == 'true'
        working-directory: packages/js
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Configure git identity
        if: steps.decide.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump and any data changes
        if: steps.decide.outputs.release == 'true'
        run: |
          git add VERSION \
                  packages/js/package.json \
                  packages/py/pyproject.toml \
                  data/ \
                  packages/go/data/ \
                  packages/php/data/ \
                  packages/py/src/is_burner_email/data/ \
                  packages/csharp/src/IsBurnerEmail/data/
          git commit -m "chore(release): v${{ steps.bumped.outputs.version }}${{ steps.decide.outputs.suffix }}"

      - name: Create multi-language tags
        if: steps.decide.outputs.release == 'true'
        run: |
          v='v${{ steps.bumped.outputs.version }}'
          git tag -a "$v"                     -m "Release $v"
          git tag -a "js/$v"                  -m "JS release $v"
          git tag -a "py/$v"                  -m "Python release $v"
          git tag -a "packages/go/$v"         -m "Go release $v"
          git tag -a "php/$v"                 -m "PHP release $v"
          git tag -a "csharp/$v"              -m "C# release $v"

      - name: Publish JS to npm via OIDC
        if: steps.decide.outputs.release == 'true'
        working-directory: packages/js
        run: npm publish --access public --provenance

      - name: Set up Python
        if: steps.decide.outputs.release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python package
        if: steps.decide.outputs.release == 'true'
        working-directory: packages/py
        run: |
          rm -rf dist
          python -m pip install --upgrade build
          python -m build

      - name: Publish Python to PyPI via OIDC
        if: steps.decide.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/py/dist

      - name: Set up .NET
        if: steps.decide.outputs.release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack C# library and CLI tool
        if: steps.decide.outputs.release == 'true'
        working-directory: packages/csharp
        run: |
          rm -rf artifacts
          dotnet pack src/IsBurnerEmail/IsBurnerEmail.csproj --configuration Release --output artifacts
          dotnet pack cli/Burner.Cli/Burner.Cli.csproj       --configuration Release --output artifacts

      # Requests a short-lived NuGet API key via OIDC. The Trusted Publishing
      # policy on nuget.org is pinned to this workflow file (release.yml) and
      # owner/repo, so no long-lived secret is stored in the repo. NUGET_USER
      # must match the nuget.org profile name that owns the policy.
      - name: NuGet login (OIDC → short-lived API key)
        if: steps.decide.outputs.release == 'true'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: steps.decide.outputs.release == 'true'
        working-directory: packages/csharp
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push commit and tags
        if: steps.decide.outputs.release == 'true'
        run: git push --follow-tags
