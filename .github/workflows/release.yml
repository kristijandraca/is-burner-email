name: Release

# Coordinated release across all seven language packages. One shared version
# lives in /VERSION and is mirrored into each package file. Tags are pushed
# per-language so every registry picks up its own trigger.
#
# Publishes JS to npm and Python to PyPI, both via Trusted Publishing (OIDC).
# Go is tag-driven — pushing packages/go/vX.Y.Z below is the release.
# PHP: see the Packagist TODO below — needs a one-time webhook registration.
#
# Data refresh is a separate workflow (refresh-lists.yml) that opens a PR.
# Once that PR is merged, a maintainer runs this workflow manually with the
# chosen bump type. Nothing publishes without a human in the loop.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root tooling
        run: npm ci

      - name: Install JS package deps
        working-directory: packages/js
        run: npm ci

      - name: Bump shared version and sync into packages
        id: bumped
        run: |
          new_version=$(npx tsx scripts/bump-version.ts ${{ inputs.bump }})
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "New version: $new_version"

      - name: Typecheck, test, build (JS)
        working-directory: packages/js
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add VERSION \
                  README.md \
                  packages/js/package.json \
                  packages/py/pyproject.toml \
                  packages/csharp/src/IsBurnerEmail/IsBurnerEmail.csproj \
                  packages/csharp/cli/Burner.Cli/Burner.Cli.csproj \
                  packages/kotlin/build.gradle.kts \
                  packages/kotlin/README.md \
                  packages/rust/Cargo.toml
          git commit -m "chore(release): v${{ steps.bumped.outputs.version }}"

      - name: Create multi-language tags
        run: |
          v='v${{ steps.bumped.outputs.version }}'
          git tag -a "$v"                     -m "Release $v"
          git tag -a "js/$v"                  -m "JS release $v"
          git tag -a "py/$v"                  -m "Python release $v"
          git tag -a "packages/go/$v"         -m "Go release $v"
          git tag -a "php/$v"                 -m "PHP release $v"
          git tag -a "csharp/$v"              -m "C# release $v"
          git tag -a "kotlin/$v"              -m "Kotlin release $v"
          git tag -a "rust/$v"                -m "Rust release $v"

      - name: Publish JS to npm via OIDC
        working-directory: packages/js
        run: npm publish --access public --provenance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python package
        working-directory: packages/py
        run: |
          rm -rf dist
          python -m pip install --upgrade build
          python -m build

      - name: Publish Python to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/py/dist

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack C# library and CLI tool
        working-directory: packages/csharp
        run: |
          rm -rf artifacts
          dotnet pack src/IsBurnerEmail/IsBurnerEmail.csproj --configuration Release --output artifacts
          dotnet pack cli/Burner.Cli/Burner.Cli.csproj       --configuration Release --output artifacts

      - name: NuGet login (OIDC → short-lived API key)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        working-directory: packages/csharp
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Kotlin library
        working-directory: packages/kotlin
        run: ./gradlew build --no-daemon

      - name: Publish Kotlin to Maven Central
        working-directory: packages/kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :lib:publishAllPublicationsToMavenCentralRepository --no-daemon --no-configuration-cache

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (OIDC)
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish Rust to crates.io
        working-directory: packages/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}

      - name: Push commit and tags
        run: git push --follow-tags
