[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "is-burner-email"
version = "1.3.6"
description = "Fast, offline burner / disposable email detection with three-list (blacklist/whitelist/graylist) classification."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kristijandraca" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["email", "burner", "disposable", "temporary", "validator", "offline"]

[project.urls]
Homepage = "https://github.com/kristijandraca/is-burner-email"
Repository = "https://github.com/kristijandraca/is-burner-email"
Issues = "https://github.com/kristijandraca/is-burner-email/issues"

[project.scripts]
burner = "is_burner_email.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

# The data files under src/is_burner_email/data/ are synced from the monorepo
# root by `npm run build:lists` (see scripts/build-lists.ts). They must be
# present before building — the release workflow runs build:lists first.
# Hatchling picks up non-Python files inside the package by default.
[tool.hatch.build.targets.wheel]
packages = ["src/is_burner_email"]

[tool.hatch.build.targets.sdist]
include = ["src/is_burner_email", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
